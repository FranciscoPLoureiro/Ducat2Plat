name: Daily Sweep

on:
  schedule:
    - cron: '0 6 * * *'
    # Baro lands ~13:00 UTC on visit Fridays; without this the 06:00 sweep
    # misses his arrival and the advisor stays empty until Saturday. Runs
    # every Friday — idempotent sweeps make off-visit Fridays harmless.
    - cron: '0 14 * * 5'
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin npm to match committed lockfiles
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Run sweep
        id: sweep
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MASTERY_RANK: ${{ vars.MASTERY_RANK || '30' }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
        run: |
          set +e
          npm run sweep
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning::Sweep completed with warnings (quality violations or >10% item failures) — see log"
            exit 0
          fi
          exit $code

      - name: Revalidate pages
        if: success()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -n "$REVALIDATE_URL" ] && [ -n "$REVALIDATE_TOKEN" ]; then
            curl -sS -f -X POST "$REVALIDATE_URL" \
              -H "x-revalidate-token: $REVALIDATE_TOKEN" \
              -H "Content-Type: application/json" \
              || echo "::warning::Revalidation request failed (non-fatal)"
          else
            echo "::notice::REVALIDATE_URL or REVALIDATE_TOKEN not set — skipping revalidation"
          fi

      - name: Alert degraded sweep
        if: steps.sweep.outputs.exit_code == '2'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "⚠️ Degraded Sweep",
              "description": "Sweep completed with warnings — data-quality violations or >10% item failures. Check the run log for the exact reason.\n\n**Workflow:** ${{ github.workflow }}\n**Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "color": 16750848
            }]
          }' "$DISCORD_WEBHOOK_URL"

      - name: Alert sweep failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "❌ Sweep Failed",
              "description": "The daily sweep workflow failed.\n\n**Workflow:** ${{ github.workflow }}\n**Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "color": 15158332
            }]
          }' "$DISCORD_WEBHOOK_URL"

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan keepalive 2>/dev/null || git switch keepalive
          # Vercel reads vercel.json from the branch it builds and the project's
          # root directory (web/). An Ignored Build Step that exits 0 on this
          # branch makes Vercel cancel the build cleanly instead of failing on
          # the empty orphan branch (which has no app to build).
          mkdir -p web
          cat > web/vercel.json <<'JSON'
          {
            "ignoreCommand": "if [ \"$VERCEL_GIT_COMMIT_REF\" = \"keepalive\" ]; then exit 0; else exit 1; fi"
          }
          JSON
          git add web/vercel.json
          git commit -m "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin keepalive --force
